name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite ejecutar manualmente
  repository_dispatch:  # Permite trigger desde otro repo
    types: [vault-updated]
  schedule:
    - cron: '0 */6 * * *'  # Cada 6 horas como respaldo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Obsidian vault
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.VAULT_TOKEN }}@github.com/ph27p2t9hq-ship-it/obsidian-vault.git vault-temp

      - name: Sync Zettelkasten to content
        run: |
          rm -rf content/Zettelkasten
          cp -r vault-temp/Zettelkasten content/
          # Recreate symlink for index
          rm -f content/index.md
          ln -s Zettelkasten/Bienvenidos.md content/index.md
          # Cleanup
          rm -rf vault-temp

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
