name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite ejecutar manualmente
  repository_dispatch:  # Permite trigger desde otro repo
    types: [vault-updated]
  schedule:
    - cron: '0 */6 * * *'  # Cada 6 horas como respaldo

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone Obsidian vault (with history for dates)
        run: |
          git clone https://x-access-token:${{ secrets.VAULT_TOKEN }}@github.com/ph27p2t9hq-ship-it/obsidian-vault.git vault-temp

      - name: Sync Zettelkasten to content root
        run: |
          # Clear existing content except static files
          find content -mindepth 1 -not -name '.gitkeep' -not -name '.gitignore' -delete 2>/dev/null || true

          # Copy Zettelkasten files directly to content (not in subfolder)
          cp -r vault-temp/Zettelkasten/* content/

          # Set Bienvenidos.md as index
          if [ -f content/Bienvenidos.md ]; then
            cp content/Bienvenidos.md content/index.md
          fi

      - name: Sync Readwise as unlisted (for embeds only)
        run: |
          # Copy Readwise folder
          if [ -d vault-temp/Readwise ]; then
            cp -r vault-temp/Readwise content/Readwise

            # Mark all Readwise files as unlisted (won't appear in explorer/graph)
            find content/Readwise -name "*.md" -type f | while read file; do
              if head -1 "$file" | grep -q "^---"; then
                # Has frontmatter - add unlisted after first line
                sed -i '2i unlisted: true' "$file"
              else
                # No frontmatter - create it
                sed -i '1i ---\nunlisted: true\n---\n' "$file"
              fi
            done
          fi

      - name: Add modification dates to frontmatter
        run: |
          cd vault-temp
          for file in Zettelkasten/*.md; do
            filename=$(basename "$file")
            target="../content/$filename"
            if [ -f "$target" ]; then
              # Get last modification date from git
              mod_date=$(git log -1 --format="%aI" -- "$file" 2>/dev/null | cut -d'T' -f1)
              if [ -n "$mod_date" ]; then
                # Check if file has frontmatter
                if head -1 "$target" | grep -q "^---"; then
                  # Add modified date to existing frontmatter
                  sed -i "2i modified: $mod_date" "$target"
                else
                  # Create frontmatter with modified date
                  sed -i "1i ---\nmodified: $mod_date\n---\n" "$target"
                fi
              fi
            fi
          done
          cd ..
          rm -rf vault-temp

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
