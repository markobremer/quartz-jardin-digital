<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F4F6F6; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header {
  background: #16A085; padding: 25pt 40pt;
  border-bottom: 5pt solid #FF6B9D;
}
h1 {
  color: #ffffff; font-size: 32pt; margin: 0;
  font-weight: bold;
}
.content {
  padding: 40pt; color: #2C3E50;
}
.box {
  background: #ffffff; padding: 30pt;
  border-left: 8pt solid #FF6B9D;
  box-shadow: 3px 3px 10px rgba(0, 0, 0, 0.1);
}
.box p {
  font-size: 18pt; line-height: 1.7; margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1>Objetivo General</h1>
</div>
<div class="content">
  <div class="box">
    <p>Sistematizar la experiencia del programa Protagonistas del Cambio para generar un <b>modelo formativo optimizado, documentado y escalable</b>, organizado bajo el marco lógico, que permita su replicación en diversos contextos educativos.</p>
  </div>
</div>
</body>
</html>
