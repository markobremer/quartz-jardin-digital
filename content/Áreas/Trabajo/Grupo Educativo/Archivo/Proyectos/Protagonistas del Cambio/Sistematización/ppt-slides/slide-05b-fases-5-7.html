<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F4F6F6; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header {
  background: #16A085; padding: 20pt 40pt;
  border-bottom: 5pt solid #FF6B9D;
}
h1 {
  color: #ffffff; font-size: 32pt; margin: 0;
  font-weight: bold;
}
.content {
  padding: 30pt 40pt 50pt 40pt; color: #2C3E50;
}
.timeline {
  display: flex; flex-direction: column; gap: 8pt;
}
.phase {
  display: flex; align-items: center; background: #ffffff;
  padding: 12pt 18pt; border-left: 5pt solid #FF6B9D;
  box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.07);
}
.phase-num {
  min-width: 45pt;
}
.phase-num p {
  font-size: 20pt; font-weight: bold; color: #16A085; margin: 0;
}
.phase-info p {
  margin: 0; font-size: 13pt; line-height: 1.3;
}
.phase-name {
  font-weight: bold; color: #2C3E50;
  margin-bottom: 4pt;
}
.phase-duration {
  color: #666; font-size: 11.5pt;
}
</style>
</head>
<body>
<div class="header">
  <h1>Arquitectura: Fases 5-7</h1>
</div>
<div class="content">
  <div class="timeline">
    <div class="phase">
      <div class="phase-num"><p>5</p></div>
      <div class="phase-info">
        <p class="phase-name">Validación con Dirección GE</p>
        <p class="phase-duration">0.5 semanas - Diciembre</p>
      </div>
    </div>
    <div class="phase">
      <div class="phase-num"><p>6</p></div>
      <div class="phase-info">
        <p class="phase-name">Producción de Materiales Moodle</p>
        <p class="phase-duration">3 semanas - Diciembre/Enero</p>
      </div>
    </div>
    <div class="phase">
      <div class="phase-num"><p>7</p></div>
      <div class="phase-info">
        <p class="phase-name">Montaje y Ajustes Finales</p>
        <p class="phase-duration">0.5 semanas - Enero</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
